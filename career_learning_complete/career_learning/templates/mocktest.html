<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Tests - Career.learning</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        header h1 {
            color: #667eea;
            margin-bottom: 10px;
        }

        header p {
            color: #666;
            font-size: 14px;
        }

        /* ── Dashboard View ── */
        .dashboard {
            display: none;
        }

        .tests-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .test-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .test-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
        }

        .test-card h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .test-meta {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #999;
            margin: 10px 0;
        }

        .test-meta span {
            background: #f0f0f0;
            padding: 4px 8px;
            border-radius: 4px;
            margin-right: 5px;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
            text-decoration: none;
        }

        .btn:hover {
            background: #764ba2;
        }

        .btn-danger {
            background: #ff6b6b;
        }

        .btn-danger:hover {
            background: #ff5252;
        }

        .btn-success {
            background: #51cf66;
        }

        .btn-success:hover {
            background: #40c057;
        }

        /* ── Test Interface ── */
        .test-interface {
            display: none;
        }

        .test-header {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .test-title {
            flex: 1;
        }

        .test-title h2 {
            color: #667eea;
            margin-bottom: 5px;
        }

        .test-title p {
            color: #999;
            font-size: 12px;
        }

        .timer {
            font-size: 24px;
            font-weight: bold;
            padding: 15px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
            text-align: center;
            min-width: 120px;
        }

        .timer.warning {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }

        .timer.critical {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }

        .questions-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .question-box {
            margin-bottom: 30px;
            padding-bottom: 30px;
            border-bottom: 1px solid #eee;
        }

        .question-box:last-child {
            border-bottom: none;
        }

        .question-number {
            color: #667eea;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 16px;
            color: #333;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-box {
            display: flex;
            align-items: center;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .option-box:hover {
            border-color: #667eea;
            background: #f9f7ff;
        }

        .option-box input[type="radio"] {
            margin-right: 12px;
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        .option-box input[type="radio"]:checked + label {
            color: #667eea;
            font-weight: bold;
        }

        .option-box.selected {
            border-color: #667eea;
            background: #f9f7ff;
        }

        .option-text {
            cursor: pointer;
            flex: 1;
            color: #333;
        }

        .test-actions {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            justify-content: center;
        }

        /* ── Results View ── */
        .results-view {
            display: none;
        }

        .score-card {
            background: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .score-display {
            font-size: 64px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .score-total {
            font-size: 18px;
            color: #999;
            margin-bottom: 20px;
        }

        .score-percentage {
            font-size: 28px;
            color: #51cf66;
            margin-bottom: 20px;
        }

        .performance-message {
            font-size: 18px;
            color: #666;
            margin-bottom: 20px;
        }

        .score-breakdown {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-box {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #999;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .review-section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .review-section h3 {
            color: #667eea;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .review-item {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        .review-item:last-child {
            border-bottom: none;
        }

        .review-question {
            font-weight: 500;
            color: #333;
            margin-bottom: 10px;
        }

        .review-answer {
            display: flex;
            gap: 20px;
            font-size: 14px;
            margin-top: 10px;
        }

        .answer-row {
            flex: 1;
        }

        .answer-label {
            color: #999;
            font-size: 12px;
            margin-bottom: 3px;
        }

        .answer-text {
            color: #333;
            font-weight: 500;
        }

        .correct {
            color: #51cf66;
        }

        .incorrect {
            color: #ff6b6b;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }

        .status-correct {
            background: #d4edda;
            color: #155724;
        }

        .status-incorrect {
            background: #f8d7da;
            color: #721c24;
        }

        /* ── Loading ── */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .tab {
            padding: 12px 24px;
            cursor: pointer;
            border-radius: 999px;
            color: #f8fafc;
            background: transparent;
            transition: all 0.3s ease;
            border: 1px solid transparent;
            white-space: nowrap;
        }

        .tab:hover {
            background: rgba(255, 255, 255, 0.16);
        }

        .tab.active {
            background: #ffffff;
            color: #333333;
            font-weight: 700;
            border-color: rgba(102, 126, 234, 0.2);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 Mock Test Module</h1>
            <p>Prepare for entrance exams with comprehensive mock tests</p>
        </header>

        <!-- Dashboard View -->
        <div class="dashboard" id="dashboardView">
            <div class="tabs">
                <div class="tab active" data-tab="available">Available Tests</div>
                <div class="tab" data-tab="history">My Attempts</div>
            </div>

            <div id="available" class="tab-content active">
                <div class="tests-grid" id="testsGrid">
                    <div class="loader"></div>
                </div>
            </div>

            <div id="history" class="tab-content">
                <div id="historyContainer"></div>
            </div>
        </div>

        <!-- Test Interface -->
        <div class="test-interface" id="testInterface">
            <div class="test-header">
                <div class="test-title">
                    <h2 id="testTitle">Test Name</h2>
                    <p id="testInfo">Subject • Difficulty</p>
                </div>
                <div class="timer" id="timer">00:00</div>
            </div>

            <div class="questions-container" id="questionsContainer">
                <div class="loader"></div>
            </div>

            <div class="test-actions">
                <button class="btn btn-danger" onclick="goBackToDashboard()">Back</button>
                <button class="btn btn-success" onclick="submitTest()">Submit Test</button>
            </div>
        </div>

        <!-- Results View -->
        <div class="results-view" id="resultsView">
            <button class="btn" onclick="goBackToDashboard()" style="margin-bottom: 20px;">← Back to Dashboard</button>
            
            <div class="score-card">
                <div class="score-display" id="finalScore">0</div>
                <div class="score-total" id="scoreTotal">Out of 100</div>
                <div class="score-percentage" id="scorePercentage">0%</div>
                <div class="performance-message" id="performanceMsg">Good attempt!</div>
                
                <div class="score-breakdown">
                    <div class="stat-box">
                        <div class="stat-label">Correct</div>
                        <div class="stat-value" id="statCorrect">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Incorrect</div>
                        <div class="stat-value" id="statIncorrect">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Unanswered</div>
                        <div class="stat-value" id="statUnanswered">0</div>
                    </div>
                </div>
            </div>

            <div class="review-section">
                <h3>📝 Detailed Review</h3>
                <div id="reviewContainer"></div>
            </div>
        </div>
    </div>

    <script>
        // ──────────────────────────────────────────────────────────────────
        // STATE
        // ──────────────────────────────────────────────────────────────────
        let currentTest = null;
        let questions = [];
        let userAnswers = {};
        let timerInterval = null;
        let timeRemaining = 0;
        let testStartTime = null;

        // ──────────────────────────────────────────────────────────────────
        // INITIALIZATION
        // ──────────────────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', function() {
            setupEventListeners();
            loadDashboard();
        });

        function setupEventListeners() {
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', function(event) {
                    switchTab(this.dataset.tab, event.target);
                });
            });
        }

        // ──────────────────────────────────────────────────────────────────
        // DASHBOARD FUNCTIONS
        // ──────────────────────────────────────────────────────────────────
        function loadDashboard() {
            document.getElementById('dashboardView').style.display = 'block';
            document.getElementById('testInterface').style.display = 'none';
            document.getElementById('resultsView').style.display = 'none';
            loadTests();
        }

        function loadTests() {
            fetch('/api/mocktest/list')
                .then(res => res.json())
                .then(tests => {
                    const grid = document.getElementById('testsGrid');
                    grid.innerHTML = '';
                    
                    tests.forEach(test => {
                        const card = document.createElement('div');
                        card.className = 'test-card';
                        card.innerHTML = `
                            <h3>${test.title}</h3>
                            <div class="test-meta">
                                <span>${test.subject}</span>
                                <span>${test.exam_type}</span>
                                <span>${test.difficulty_level}</span>
                            </div>
                            <p style="color: #999; font-size: 13px; margin: 10px 0;">
                                ${test.total_questions} questions • ${test.duration} mins
                            </p>
                            <button class="btn" onclick="startTest(${test.id})">Start Test</button>
                        `;
                        grid.appendChild(card);
                    });
                })
                .catch(err => console.error('Error loading tests:', err));
        }

        function switchTab(tabName, target) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            const activeTab = target || document.querySelector(`.tab[data-tab="${tabName}"]`);
            if (activeTab) {
                activeTab.classList.add('active');
            }
            document.getElementById(tabName).classList.add('active');
            
            if (tabName === 'history') {
                loadTestHistory();
            }
        }

        function loadTestHistory() {
            fetch('/api/mocktest/history')
                .then(res => res.json())
                .then(attempts => {
                    const container = document.getElementById('historyContainer');
                    
                    if (attempts.length === 0) {
                        container.innerHTML = '<p style="color: #999; text-align: center;">No test attempts yet</p>';
                        return;
                    }
                    
                    let html = '<div class="tests-grid">';
                    attempts.forEach(attempt => {
                        html += `
                            <div class="test-card">
                                <h3>${attempt.title}</h3>
                                <div class="test-meta">
                                    <span>${attempt.subject}</span>
                                </div>
                                <p style="color: #667eea; font-weight: bold; margin: 10px 0; font-size: 18px;">
                                    ${attempt.score}/${attempt.total_questions} (${attempt.percentage.toFixed(1)}%)
                                </p>
                                <p style="color: #999; font-size: 12px; margin: 5px 0;">
                                    ${new Date(attempt.attempted_at).toLocaleDateString()}
                                </p>
                                <button class="btn" onclick="viewResult(${attempt.id})">View Result</button>
                            </div>
                        `;
                    });
                    html += '</div>';
                    container.innerHTML = html;
                })
                .catch(err => console.error('Error loading history:', err));
        }

        // ──────────────────────────────────────────────────────────────────
        // TEST INTERFACE
        // ──────────────────────────────────────────────────────────────────
        function startTest(testId) {
            fetch(`/api/mocktest/${testId}`)
                .then(res => res.json())
                .then(data => {
                    currentTest = data.test;
                    questions = data.questions;
                    userAnswers = {};
                    
                    document.getElementById('dashboardView').style.display = 'none';
                    document.getElementById('testInterface').style.display = 'block';
                    
                    document.getElementById('testTitle').textContent = currentTest.title;
                    document.getElementById('testInfo').textContent = 
                        `${currentTest.subject} • ${currentTest.total_questions} questions • ${currentTest.duration} minutes`;
                    
                    renderQuestions();
                    startTimer(currentTest.duration * 60);
                    testStartTime = Date.now();
                })
                .catch(err => console.error('Error starting test:', err));
        }

        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';
            
            questions.forEach((q, idx) => {
                const qBox = document.createElement('div');
                qBox.className = 'question-box';
                qBox.innerHTML = `
                    <div class="question-number">Question ${idx + 1} of ${questions.length}</div>
                    <div class="question-text">${q.question_text}</div>
                    <div class="options" id="options-${q.id}">
                        ${q.options.map((opt, optIdx) => `
                            <label class="option-box" data-option-id="${opt.id}">
                                <input type="radio" name="question-${q.id}" value="${opt.id}" 
                                    onchange="recordAnswer(${q.id}, ${opt.id})">
                                <span class="option-text">${opt.text}</span>
                            </label>
                        `).join('')}
                    </div>
                `;
                container.appendChild(qBox);
            });
        }

        function recordAnswer(questionId, optionId) {
            userAnswers[questionId] = optionId;
            const optionLabel = document.querySelector(`[data-option-id="${optionId}"]`);
            if (optionLabel) {
                optionLabel.classList.add('selected');
            }
        }

        function startTimer(seconds) {
            timeRemaining = seconds;
            const timerEl = document.getElementById('timer');
            
            timerInterval = setInterval(() => {
                const mins = Math.floor(timeRemaining / 60);
                const secs = timeRemaining % 60;
                timerEl.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                
                if (timeRemaining < 300) {
                    timerEl.classList.add('warning');
                }
                if (timeRemaining < 60) {
                    timerEl.classList.add('critical');
                }
                
                timeRemaining--;
                
                if (timeRemaining < 0) {
                    clearInterval(timerInterval);
                    submitTest();
                }
            }, 1000);
        }

        function submitTest() {
            clearInterval(timerInterval);
            
            const answers = {};
            questions.forEach(q => {
                answers[q.id] = userAnswers[q.id] || null;
            });
            
            fetch('/api/mocktest/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    test_id: currentTest.id,
                    answers: answers
                })
            })
            .then(res => res.json())
            .then(data => {
                showResults(data);
            })
            .catch(err => console.error('Error submitting test:', err));
        }

        // ──────────────────────────────────────────────────────────────────
        // RESULTS
        // ──────────────────────────────────────────────────────────────────
        function showResults(data) {
            document.getElementById('testInterface').style.display = 'none';
            document.getElementById('resultsView').style.display = 'block';
            
            const incorrect = data.total - data.correct_answers;
            const unanswered = questions.length - (data.total - incorrect);
            
            document.getElementById('finalScore').textContent = data.score;
            document.getElementById('scoreTotal').textContent = `Out of ${data.total}`;
            document.getElementById('scorePercentage').textContent = `${data.percentage.toFixed(1)}%`;
            
            const perfMsg = data.percentage >= 80 ? 'Excellent performance! 🎉' :
                            data.percentage >= 60 ? 'Good attempt! 👍' :
                            data.percentage >= 40 ? 'Keep practicing 💪' :
                            'More practice needed 📚';
            document.getElementById('performanceMsg').textContent = perfMsg;
            
            document.getElementById('statCorrect').textContent = data.correct_answers;
            document.getElementById('statIncorrect').textContent = incorrect;
            document.getElementById('statUnanswered').textContent = unanswered;
            
            renderReview(data);
        }

        function renderReview(data) {
            const container = document.getElementById('reviewContainer');
            container.innerHTML = '';
            
            data.detailed_answers.forEach((answer, idx) => {
                const question = questions.find(q => q.id === answer.question_id);
                const selectedOpt = question.options.find(o => o.id === answer.selected_option_id);
                const correctOpt = question.options.find(o => o.id === answer.correct_option_id);
                
                const item = document.createElement('div');
                item.className = 'review-item';
                item.innerHTML = `
                    <div class="review-question">
                        Question ${idx + 1}
                        <span class="status-badge ${answer.is_correct ? 'status-correct' : 'status-incorrect'}">
                            ${answer.is_correct ? '✓ Correct' : '✗ Incorrect'}
                        </span>
                    </div>
                    <p style="color: #333; margin-bottom: 10px;">${question.question_text}</p>
                    <div class="review-answer">
                        <div class="answer-row">
                            <div class="answer-label">Your Answer:</div>
                            <div class="answer-text ${answer.is_correct ? 'correct' : 'incorrect'}">
                                ${selectedOpt ? selectedOpt.text : 'Not Answered'}
                            </div>
                        </div>
                        ${!answer.is_correct ? `
                            <div class="answer-row">
                                <div class="answer-label">Correct Answer:</div>
                                <div class="answer-text correct">${correctOpt ? correctOpt.text : 'N/A'}</div>
                            </div>
                        ` : ''}
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function viewResult(attemptId) {
            fetch(`/api/mocktest/result/${attemptId}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('dashboardView').style.display = 'none';
                    document.getElementById('resultsView').style.display = 'block';
                    
                    const incorrect = data.attempt.total - data.attempt.score;
                    document.getElementById('finalScore').textContent = data.attempt.score;
                    document.getElementById('scoreTotal').textContent = `Out of ${data.attempt.total}`;
                    document.getElementById('scorePercentage').textContent = `${data.attempt.percentage.toFixed(1)}%`;
                    
                    document.getElementById('statCorrect').textContent = data.attempt.score;
                    document.getElementById('statIncorrect').textContent = incorrect;
                    
                    const reviewContainer = document.getElementById('reviewContainer');
                    reviewContainer.innerHTML = '';
                    data.questions_review.forEach((q, idx) => {
                        const item = document.createElement('div');
                        item.className = 'review-item';
                        item.innerHTML = `
                            <div class="review-question">
                                Question ${idx + 1}
                                <span class="status-badge ${q.is_correct ? 'status-correct' : 'status-incorrect'}">
                                    ${q.is_correct ? '✓ Correct' : '✗ Incorrect'}
                                </span>
                            </div>
                            <p style="color: #333; margin-bottom: 10px;">${q.question_text}</p>
                            <div class="review-answer">
                                <div class="answer-row">
                                    <div class="answer-label">Your Answer:</div>
                                    <div class="answer-text ${q.is_correct ? 'correct' : 'incorrect'}">
                                        ${q.selected_option}
                                    </div>
                                </div>
                                ${!q.is_correct ? `
                                    <div class="answer-row">
                                        <div class="answer-label">Correct Answer:</div>
                                        <div class="answer-text correct">${q.correct_option}</div>
                                    </div>
                                ` : ''}
                            </div>
                        `;
                        reviewContainer.appendChild(item);
                    });
                })
                .catch(err => console.error('Error loading result:', err));
        }

        function goBackToDashboard() {
            clearInterval(timerInterval);
            loadDashboard();
        }
    </script>
</body>
</html>
